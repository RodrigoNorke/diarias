<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CashLog</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- ECharts (gráficos) ainda é carregado normalmente -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        /* ... (mantenha todo o CSS da versão futurista) ... */
    </style>
</head>
<body id="corpo">
    <!-- ... (mantenha todo o HTML da versão futurista) ... -->

    <!-- Script principal -->
    <script>
        // ============================================================================
        // CASHLOG – APLICAÇÃO REFATORADA (COM CARREGAMENTO DINÂMICO DO SUPABASE)
        // ============================================================================
        (function() {
            // Configuração
            const SUPABASE_URL = "https://xptujmysydmczmhpoebn.supabase.co";
            const SUPABASE_KEY = "sb_publishable_jPJMaONcjw2IqqKBiRkt9A_P33ZYNY_";
            const ADM_EMAIL = "rodriggo.oliveira20@gmail.com";
            const ITENS_POR_PAGINA = 15;

            // Estado
            let supabase;
            let usuarioAtual = null;
            let ehAdmin = false;
            let temaEscuro = true;
            let abaAtiva = 'diarias';
            let diarias = [];
            let descontos = [];
            let graficoInstancia = null;
            let graficoUsuarioInstancia = null;
            let paginaDiarias = 1;
            let paginaDescontos = 1;
            let ultimoDesfazer = null;
            let desfazerTimer = null;
            let debounceTimerDiarias = null;
            let debounceTimerDescontos = null;

            // ... (todas as funções utilitárias, autenticação, carregamento, filtros, tabelas, gráficos, modais, exclusão, exportação – igual à versão anterior) ...

            // ========================
            // INICIALIZAÇÃO COM CARREGAMENTO DINÂMICO DO SUPABASE
            // ========================
            function carregarScript(url) {
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = url;
                    script.onload = resolve;
                    script.onerror = () => reject(new Error(`Falha ao carregar script: ${url}`));
                    document.head.appendChild(script);
                });
            }

            async function iniciar() {
                try {
                    // Verifica se o DOM já está pronto
                    if (document.readyState === 'loading') {
                        await new Promise(resolve => {
                            document.addEventListener('DOMContentLoaded', resolve, { once: true });
                        });
                    }

                    // Carrega dinamicamente o Supabase
                    if (!window.supabase) {
                        console.log('Carregando Supabase...');
                        await carregarScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
                    }

                    if (!window.supabase) {
                        throw new Error('Não foi possível carregar a biblioteca Supabase. Verifique sua conexão com a internet.');
                    }

                    // Cria o cliente
                    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
                        realtime: { params: { eventsPerSecond: 10 } },
                        auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: true }
                    });

                    carregarTema();
                    verificarConexao();

                    // Verifica sessão
                    const { data: { session } } = await supabase.auth.getSession();
                    if (session?.user) {
                        usuarioAtual = session.user;
                        ehAdmin = (usuarioAtual.email || '').toLowerCase() === ADM_EMAIL.toLowerCase();
                        entrarApp(usuarioAtual);
                    } else {
                        document.getElementById('telaLogin').style.display = 'flex';
                    }

                    // Listener de autenticação
                    supabase.auth.onAuthStateChange(async (event, session) => {
                        if (event === 'SIGNED_IN' && session?.user && !usuarioAtual) {
                            usuarioAtual = session.user;
                            ehAdmin = (usuarioAtual.email || '').toLowerCase() === ADM_EMAIL.toLowerCase();
                            entrarApp(usuarioAtual);
                        }
                    });

                    // Atalhos de teclado
                    document.addEventListener('keydown', (e) => {
                        if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                            e.preventDefault();
                            if (abaAtiva === 'diarias') abrirModalDiaria();
                            else abrirModalDesconto();
                        }
                        if (e.key === 'Escape') {
                            fecharModalDiaria();
                            fecharModalDesconto();
                        }
                    });

                    // Fechar modais ao clicar fora
                    document.getElementById('modalDiaria').addEventListener('click', (e) => {
                        if (e.target.id === 'modalDiaria') fecharModalDiaria();
                    });
                    document.getElementById('modalDesconto').addEventListener('click', (e) => {
                        if (e.target.id === 'modalDesconto') fecharModalDesconto();
                    });

                    console.log('CashLog iniciado com sucesso!');
                } catch (erro) {
                    console.error('Erro na inicialização:', erro);
                    // Exibe mensagem de erro no login (se o elemento existir)
                    const mensagemLogin = document.getElementById('mensagemLogin');
                    if (mensagemLogin) {
                        mensagemLogin.innerHTML = `<span style="color:var(--erro)">${erro.message || 'Erro ao inicializar o aplicativo.'}</span>`;
                    } else {
                        // Se nem o elemento de mensagem existe, mostra um alerta
                        alert('Erro ao inicializar: ' + erro.message);
                    }
                    // Garante que a tela de login fique visível
                    const telaLogin = document.getElementById('telaLogin');
                    if (telaLogin) telaLogin.style.display = 'flex';
                }
            }

            // Expor a função de iniciar globalmente (para caso precise chamar de fora)
            window.App = window.App || {};
            window.App.iniciar = iniciar;

            // Inicia automaticamente
            iniciar();
        })();
    </script>
</body>
</html>
