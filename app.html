<script>

(function() {
  // Configuração
  const SUPABASE_URL = "https://xptujmysydmczmhpoebn.supabase.co";
  const SUPABASE_KEY = "sb_publishable_jPJMaONcjw2IqqKBiRkt9A_P33ZYNY_";
  const ADM_EMAIL = "rodriggo.oliveira20@gmail.com";
  const ITENS_POR_PAGINA = 15;

  // Estado
  let supabase;
  let usuarioAtual = null;

  let temaEscuro = true;
  let abaAtiva = 'diarias';
  let diarias = [];

  // ========================
  // UTILITÁRIOS
  // ========================
  function moeda(valor) {
    return Number(valor || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function moedaParaNumero(valor) {
    return Number(String(valor || '').replace(/\D/g, '')) / 100;
  }

  function formatarValor(input) {
    const valor = input.value.replace(/\D/g, '');
    if (!valor) {
      input.value = '';
      return;
    }
    const numero = parseInt(valor, 10);
    input.value = (numero / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function dataBr(data) {
    return new Date(data + 'T00:00:00').toLocaleDateString('pt-BR');
  }

  function mesAno(data) {
    return new Date(data + 'T00:00:00').toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  }

  function chaveMes(data) {
    const dt = new Date(data + 'T00:00:00');
    return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}`;
  }

  function nomeMes(mes) {
    const nomes = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    return nomes[Number(mes) - 1] || mes;
  }

  function hoje() {
    return new Date().toISOString().split('T')[0];
  }

  function toast(mensagem, tipo = 'sucesso') {
    const toastEl = document.createElement('div');
    toastEl.className = `toast ${tipo}`;
    toastEl.innerHTML = mensagem;
    document.body.appendChild(toastEl);
    setTimeout(() => toastEl.remove(), 3500);
  }

  function mensagemAmigavel(erro) {
    const mensagens = {
      'Email not confirmed': 'E-mail não confirmado — verifique sua caixa de entrada',
      'Invalid login credentials': 'E-mail ou senha incorretos',
      'Password should be at least 6 characters': 'Senha deve ter pelo menos 6 caracteres',
      'User already registered': 'Este e-mail já está cadastrado',
      'data_nao_futura': 'A data não pode ser futura',
      'valor_positivo': 'O valor deve ser maior que zero',
      'desconto_valor_positivo': 'O valor deve ser maior que zero',
      'desconto_data_nao_futura': 'A data não pode ser futura'
    };
    const mensagem = erro?.message || erro?.details || 'Ocorreu um erro. Tente novamente.';
    for (const [chave, texto] of Object.entries(mensagens)) {
      if (mensagem.includes(chave)) return texto;
    }
    return mensagem;
  }

  function setStatus(texto, cor) {
    const el = document.getElementById('statusConexao');
    if (!el) return;
    el.innerHTML = texto;
    if (cor) el.style.background = cor;
  }

  function verificarConexao() {
    const off = document.getElementById('avisoOffline');
    if (navigator.onLine) {
      off.style.display = 'none';
      setStatus('🟢 Online', 'rgba(74,222,128,.15)');
    } else {
      off.style.display = 'block';
      setStatus('⚠️ Offline', 'rgba(250,204,21,.15)');
    }
  }

  window.addEventListener('online', verificarConexao);
  window.addEventListener('offline', verificarConexao);

  function carregarTema() {
    const temaSalvo = localStorage.getItem('tema');
    if (temaSalvo === 'claro') {
      temaEscuro = false;
      document.getElementById('corpo').classList.add('tema-claro');
    }
  }

  function alternarTema() {
    temaEscuro = !temaEscuro;
    document.getElementById('corpo').classList.toggle('tema-claro', !temaEscuro);
    localStorage.setItem('tema', temaEscuro ? 'escuro' : 'claro');
    setTimeout(() => {
      if (graficoInstancia) graficoInstancia.resize();
      if (graficoUsuarioInstancia) graficoUsuarioInstancia.resize();
    }, 100);

  // ========================
  // GERENCIAMENTO DE ABAS
  // ========================
  function selecionarAba(nomeAba) {
    abaAtiva = nomeAba;
    document.querySelectorAll('.aba').forEach(aba => aba.classList.remove('ativa'));
    document.querySelectorAll('.painel-conteudo').forEach(painel => painel.classList.remove('ativa'));
    document.getElementById(`aba${nomeAba.charAt(0).toUpperCase() + nomeAba.slice(1)}`).classList.add('ativa');
    document.getElementById(`painel${nomeAba.charAt(0).toUpperCase() + nomeAba.slice(1)}`).classList.add('ativa');

  // ========================
  // AUTENTICAÇÃO
  // ========================
  function mostrarCadastro() {
    document.getElementById('formEntrar').style.display = 'none';
    document.getElementById('formCadastro').style.display = 'block';
    document.getElementById('mensagemLogin').innerHTML = '';
  }

  function mostrarLogin() {
    document.getElementById('formEntrar').style.display = 'block';
    document.getElementById('formCadastro').style.display = 'none';
    document.getElementById('mensagemLogin').innerHTML = '';
  }

  async function fazerCadastro() {
    const nome = document.getElementById('nomeCad').value.trim();
    const email = document.getElementById('emailCad').value.trim();
    const senha = document.getElementById('senhaCad').value;

    if (!nome || !email || senha.length < 6) {
      document.getElementById('mensagemLogin').innerHTML = '<span style="color:var(--erro)">Preencha todos os campos. Senha com mínimo 6 caracteres.</span>';
      return;
    }

    const { error } = await supabase.auth.signUp({
      email,
      password: senha,
      options: { data: { nome } }
    });

    if (error) {
      document.getElementById('mensagemLogin').innerHTML = `<span style="color:var(--erro)">${mensagemAmigavel(error)}</span>`;
      return;
    }

    document.getElementById('mensagemLogin').innerHTML = '<span style="color:var(--sucesso)">✅ Conta criada! Verifique seu e-mail para ativar.</span>';
    toast('Conta criada! Confirme seu e-mail antes de entrar.', 'aviso');
    mostrarLogin();
  }

  async function fazerLogin() {
    const email = document.getElementById('emailLogin').value.trim();
    const senha = document.getElementById('senhaLogin').value;

    if (!email || !senha) {
      document.getElementById('mensagemLogin').innerHTML = '<span style="color:var(--erro)">Preencha e-mail e senha.</span>';
      return;
    }

    try {
      const { error } = await supabase.auth.signInWithPassword({ email, password: senha });

      if (error) {
        document.getElementById('mensagemLogin').innerHTML = `<span style="color:var(--erro)">${mensagemAmigavel(error)}</span>`;
        return;
      }
      // O onAuthStateChange cuidará da entrada
    } catch (erro) {
      console.error('Erro no login:', erro);
      document.getElementById('mensagemLogin').innerHTML = '<span style="color:var(--erro)">Erro ao conectar com o servidor. Verifique sua conexão.</span>';
    }
  }

  async function sairConta() {
    if (!confirm('Sair da conta?')) return;
    await supabase.auth.signOut();

    descontos = [];
    document.getElementById('telaLogin').style.display = 'flex';
    document.getElementById('telaApp').style.display = 'none';

  function entrarApp(usuario) {
    usuarioAtual = usuario;
    ehAdmin = (usuario.email || '').toLowerCase() === ADM_EMAIL.toLowerCase();
    document.getElementById('telaLogin').style.display = 'none';
    document.getElementById('telaApp').style.display = 'block';

      .on('postgres_changes', { event: '*', schema: 'public', table: 'diarias' }, () => carregarDiarias())
      .subscribe();
    supabase.channel('descontos-sync')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'descontos' }, () => carregarDescontos())
      .subscribe();

  // ========================
  // CARREGAMENTO DE DADOS
  // ========================
  async function carregarTudoDoBanco() {
    await Promise.all([carregarDiarias(), carregarDescontos()]);
  }

  async function carregarDiarias() {
    document.getElementById('carregandoDiarias').style.display = 'block';
    try {
      let query = supabase.from('diarias').select('*');
      if (!ehAdmin) query = query.eq('usuario_id', usuarioAtual.id);
      query = query.order('data', { ascending: false });
      const { data, error } = await query;
      if (error) throw error;
      diarias = data || [];
      setStatus('🟢 Online', 'rgba(74,222,128,.15)');
      atualizarTudoDiarias();
    } catch (erro) {
      setStatus('🔴 Erro', 'rgba(248,113,113,.15)');
      toast(mensagemAmigavel(erro), 'erro');
    } finally {
      document.getElementById('carregandoDiarias').style.display = 'none';
    }
  }

  async function carregarDescontos() {
    document.getElementById('carregandoDescontos').style.display = 'block';
    try {
      let query = supabase.from('descontos').select('*');
      if (!ehAdmin) query = query.eq('usuario_id', usuarioAtual.id);
      query = query.order('data', { ascending: false });
      const { data, error } = await query;
      if (error) throw error;
      descontos = data || [];
      atualizarTudoDescontos();
    } catch (erro) {
      toast(mensagemAmigavel(erro), 'erro');
    } finally {
      document.getElementById('carregandoDescontos').style.display = 'none';
    }

  // ========================
  // FILTROS E BUSCA
  // ========================
  function diariasFiltradas() {
    const busca = (document.getElementById('buscaDiarias')?.value || '').toLowerCase().trim();
    const mesSel = document.getElementById('filtroMesDiarias').value;
    const anoSel = document.getElementById('filtroAnoDiarias').value;
    const dataIn = document.getElementById('dataInicioDiarias').value;
    const dataFim = document.getElementById('dataFimDiarias').value;

    return diarias.filter(d => {
      const cm = chaveMes(d.data);
      const [ano, mes] = cm.split('-');
      const okMes = mesSel === 'todos' || cm === mesSel;
      const okAno = anoSel === 'todos' || ano === anoSel;
      const okData = (!dataIn || d.data >= dataIn) && (!dataFim || d.data <= dataFim);
      const okBusca = !busca ||
        d.data.includes(busca) ||
        (d.descricao || '').toLowerCase().includes(busca) ||
        String(d.valor).includes(busca);
      return okMes && okAno && okData && okBusca;
    });
  }

  function descontosFiltrados() {
    const busca = (document.getElementById('buscaDescontos')?.value || '').toLowerCase().trim();
    const mesSel = document.getElementById('filtroMesDescontos').value;
    const anoSel = document.getElementById('filtroAnoDescontos').value;
    const dataIn = document.getElementById('dataInicioDescontos').value;
    const dataFim = document.getElementById('dataFimDescontos').value;

    return descontos.filter(d => {
      const cm = chaveMes(d.data);
      const [ano, mes] = cm.split('-');
      const okMes = mesSel === 'todos' || cm === mesSel;
      const okAno = anoSel === 'todos' || ano === anoSel;
      const okData = (!dataIn || d.data >= dataIn) && (!dataFim || d.data <= dataFim);
      const okBusca = !busca ||
        d.data.includes(busca) ||
        (d.descricao || '').toLowerCase().includes(busca) ||
        String(d.valor).includes(busca);
      return okMes && okAno && okData && okBusca;
    });
  }

  function preencherFiltrosDiarias() {
    const selAno = document.getElementById('filtroAnoDiarias');
    const selMes = document.getElementById('filtroMesDiarias');
    const anos = [...new Set(diarias.map(d => d.data.slice(0, 4)))].sort((a, b) => b.localeCompare(a));
    selAno.innerHTML = '<option value="todos">Todos os anos</option>' + anos.map(ano => `<option value="${ano}">${ano}</option>`).join('');
    const meses = [...new Set(diarias.map(d => chaveMes(d.data)))].sort((a, b) => b.localeCompare(a));
    selMes.innerHTML = '<option value="todos">Todos os meses</option>' + meses.map(m => {
      const [ano, mes] = m.split('-');
      return `<option value="${m}">${nomeMes(mes)} de ${ano}</option>`;
    }).join('');
  }

  function preencherFiltrosDescontos() {
    const selAno = document.getElementById('filtroAnoDescontos');
    const selMes = document.getElementById('filtroMesDescontos');
    const anos = [...new Set(descontos.map(d => d.data.slice(0, 4)))].sort((a, b) => b.localeCompare(a));
    selAno.innerHTML = '<option value="todos">Todos os anos</option>' + anos.map(ano => `<option value="${ano}">${ano}</option>`).join('');
    const meses = [...new Set(descontos.map(d => chaveMes(d.data)))].sort((a, b) => b.localeCompare(a));
    selMes.innerHTML = '<option value="todos">Todos os meses</option>' + meses.map(m => {
      const [ano, mes] = m.split('-');

  // ========================
  // PAGINAÇÃO
  // ========================
  function criarBotaoPagina(texto, novaPagina, desabilitado, ativo) {
    const classe = `btn-secondary btn-pequeno ${ativo ? 'ativo' : ''}`;
    const onclick = desabilitado ? '' : `paginar(${novaPagina})`;
    return `<button class="${classe}" ${desabilitado ? 'disabled' : ''} onclick="${onclick}">${texto}</button>`;
  }

  function atualizarPaginacao(paginaAtual, totalItens, containerId) {
    const totalPaginas = Math.ceil(totalItens / ITENS_POR_PAGINA);
    const container = document.getElementById(containerId);
    if (totalPaginas <= 1) {
      container.innerHTML = '';
      return;
    }

    let html = '';
    html += criarBotaoPagina('‹', paginaAtual - 1, paginaAtual === 1, false);
    for (let i = 1; i <= totalPaginas; i++) {
      if (i === 1 || i === totalPaginas || (i >= paginaAtual - 1 && i <= paginaAtual + 1)) {
        html += criarBotaoPagina(i, i, false, i === paginaAtual);
      } else if (i === paginaAtual - 2 || i === paginaAtual + 2) {
        html += '<span style="padding:0 4px;">...</span>';
      }
    }
    html += criarBotaoPagina('›', paginaAtual + 1, paginaAtual === totalPaginas, false);
    container.innerHTML = html;
  }

  function paginar(novaPagina) {
    if (abaAtiva === 'diarias') {
      paginaDiarias = novaPagina;
      atualizarTabelaDiarias();
    } else {
      paginaDescontos = novaPagina;
      atualizarTabelaDescontos();
    }
  }

  // ========================
  // RENDERIZAÇÃO DAS TABELAS
  // ========================
  function atualizarTabelaDiarias() {
    const lista = diariasFiltradas();
    const tbody = document.getElementById('tabelaDiarias');
    const vazio = document.getElementById('vazioDiarias');
    if (lista.length === 0) {
      tbody.innerHTML = '';
      vazio.style.display = 'block';
      document.getElementById('paginacaoDiarias').innerHTML = '';
      return;
    }
    vazio.style.display = 'none';

    const inicio = (paginaDiarias - 1) * ITENS_POR_PAGINA;
    const listaPagina = lista.slice(inicio, inicio + ITENS_POR_PAGINA);

    const grupos = {};
    listaPagina.forEach(d => {
      const cm = chaveMes(d.data);
      if (!grupos[cm]) grupos[cm] = [];
      grupos[cm].push(d);
    });

    let html = '';
    Object.keys(grupos).sort((a, b) => b.localeCompare(a)).forEach(cm => {
      const [ano, mes] = cm.split('-');
      const totalGrupo = grupos[cm].reduce((soma, d) => soma + Number(d.valor), 0);
      html += `<tr class="mes-separador"><td colspan="5" style="padding:8px 10px;"><strong>${nomeMes(mes)} de ${ano}</strong><span style="float:right;color:var(--accent);">R$ ${moeda(totalGrupo)}</span></td></tr>`;
      grupos[cm].forEach(d => {
        html += `<tr class="tbl-row" style="border-bottom:1px solid var(--border);">
          <td style="padding:10px 8px;">${dataBr(d.data)}</td>
          <td style="padding:10px 8px;color:var(--text-soft);">${d.descricao || '<span style="opacity:.5;">—</span>'}</td>
          <td style="padding:10px 8px;">${d.nome_usuario || '—'}</td>
          <td style="padding:10px 8px;text-align:right;font-size:16px;font-weight:600;color:var(--accent);">R$ ${moeda(d.valor)}</td>
          <td style="padding:10px 8px;text-align:right;">
            <button onclick='abrirModalDiaria(${JSON.stringify(d).replace(/'/g, "&#39;")})' class="btn-icone editar-btn" title="Editar">✏️</button>
            <button onclick="excluirDiaria('${d.id}','${d.usuario_id}')" class="btn-icone excluir-btn" title="Excluir">🗑️</button>
          </td>
        </tr>`;
      });
    });
    tbody.innerHTML = html;
    atualizarPaginacao(paginaDiarias, lista.length, 'paginacaoDiarias');
  }

  function atualizarTabelaDescontos() {
    const lista = descontosFiltrados();
    const tbody = document.getElementById('tabelaDescontos');
    const vazio = document.getElementById('vazioDescontos');
    if (lista.length === 0) {
      tbody.innerHTML = '';
      vazio.style.display = 'block';
      document.getElementById('paginacaoDescontos').innerHTML = '';
      return;
    }
    vazio.style.display = 'none';

    const inicio = (paginaDescontos - 1) * ITENS_POR_PAGINA;

    const grupos = {};
    listaPagina.forEach(d => {
      const cm = chaveMes(d.data);
      if (!grupos[cm]) grupos[cm] = [];
      grupos[cm].push(d);
    });

    let html = '';
    Object.keys(grupos).sort((a, b) => b.localeCompare(a)).forEach(cm => {
      const [ano, mes] = cm.split('-');

      html += `<tr class="mes-separador-desconto"><td colspan="5" style="padding:8px 10px;"><strong>${nomeMes(mes)} de ${ano}</strong><span style="float:right;color:var(--accent3);">R$ ${moeda(totalGrupo)}</span></td></tr>`;
      grupos[cm].forEach(d => {
        html += `<tr class="tbl-row tbl-row-desconto" style="border-bottom:1px solid var(--border);">
          <td style="padding:10px 8px;">${dataBr(d.data)}</td>
          <td style="padding:10px 8px;color:var(--text);font-weight:500;">${d.descricao || '—'}</td>
          <td style="padding:10px 8px;">${d.nome_usuario || '—'}</td>
          <td style="padding:10px 8px;text-align:right;font-size:16px;font-weight:600;color:var(--accent3);">R$ ${moeda(d.valor)}</td>
          <td style="padding:10px 8px;text-align:right;">
            <button onclick='abrirModalDesconto(${JSON.stringify(d).replace(/'/g, "&#39;")})' class="btn-icone editar-btn" title="Editar">✏️</button>
            <button onclick="excluirDesconto('${d.id}','${d.usuario_id}')" class="btn-icone excluir-btn" title="Excluir">🗑️</button>
          </td>
        </tr>`;
      });
    });
    tbody.innerHTML = html;
    atualizarPaginacao(paginaDescontos, lista.length, 'paginacaoDescontos');
  }

  // ========================
  // MÉTRICAS E GRÁFICOS
  // ========================
  function atualizarMetricasDiarias() {
    const lista = diariasFiltradas();
    const total = lista.reduce((soma, d) => soma + Number(d.valor), 0);
    const qtd = lista.length;
    const media = qtd > 0 ? total / qtd : 0;
    const maior = qtd > 0 ? lista.reduce((m, d) => Number(d.valor) > Number(m.valor) ? d : m) : null;
    const hojeData = new Date();
    const chaveHoje = chaveMes(hojeData.toISOString().split('T')[0]);
    const mesLista = lista.filter(d => chaveMes(d.data) === chaveHoje);
    const totalMes = mesLista.reduce((soma, d) => soma + Number(d.valor), 0);

    document.getElementById('totalDiarias').textContent = `R$ ${moeda(total)}`;
    document.getElementById('qtdDiarias').textContent = `${qtd} registro${qtd !== 1 ? 's' : ''}`;
    document.getElementById('mediaDiarias').textContent = `R$ ${moeda(media)}`;
    document.getElementById('maiorDiarias').textContent = maior ? `R$ ${moeda(maior.valor)}` : 'R$ 0,00';
    document.getElementById('maiorDataDiarias').textContent = maior ? dataBr(maior.data) : '—';
    document.getElementById('mesAtualDiarias').textContent = `R$ ${moeda(totalMes)}`;
    document.getElementById('mesInfoDiarias').textContent = `${mesLista.length} em ${mesAno(hojeData.toISOString().split('T')[0])}`;
  }

  function atualizarMetricasDescontos() {
    const lista = descontosFiltrados();
    const total = lista.reduce((soma, d) => soma + Number(d.valor), 0);
    const qtd = lista.length;
    const mesesUnicos = [...new Set(lista.map(d => chaveMes(d.data)))].length;
    const media = mesesUnicos > 0 ? total / mesesUnicos : 0;
    const maior = qtd > 0 ? lista.reduce((m, d) => Number(d.valor) > Number(m.valor) ? d : m) : null;
    const hojeData = new Date();
    const chaveHoje = chaveMes(hojeData.toISOString().split('T')[0]);
    const mesLista = lista.filter(d => chaveMes(d.data) === chaveHoje);
    const totalMes = mesLista.reduce((soma, d) => soma + Number(d.valor), 0);

    document.getElementById('totalDescontos').textContent = `R$ ${moeda(total)}`;
    document.getElementById('qtdDescontos').textContent = `${qtd} registro${qtd !== 1 ? 's' : ''}`;
    document.getElementById('mediaDescontos').textContent = `R$ ${moeda(media)}`;
    document.getElementById('maiorDescontos').textContent = maior ? `R$ ${moeda(maior.valor)}` : 'R$ 0,00';
    document.getElementById('maiorDataDescontos').textContent = maior ? dataBr(maior.data) : '—';
    document.getElementById('mesAtualDescontos').textContent = `R$ ${moeda(totalMes)}`;
    document.getElementById('mesInfoDescontos').textContent = `${mesLista.length} em ${mesAno(hojeData.toISOString().split('T')[0])}`;
  }

  function atualizarGraficoPrincipal() {
    const lista = diariasFiltradas();
    const el = document.getElementById('grafico');
    if (!el || typeof echarts === 'undefined') {
      setTimeout(atualizarGraficoPrincipal, 250);
      return;
    }
    if (!graficoInstancia) {
      graficoInstancia = echarts.init(el);
      window.addEventListener('resize', () => {
        if (graficoInstancia) graficoInstancia.resize();
        if (graficoUsuarioInstancia) graficoUsuarioInstancia.resize();
      });
    }

    const meses = {};
    lista.forEach(d => {
      const chave = chaveMes(d.data);
      meses[chave] = (meses[chave] || 0) + Number(d.valor);
    });
    const chaves = Object.keys(meses).sort();
    const rotulos = chaves.map(chave => {
      const [ano, mes] = chave.split('-');
      return `${nomeMes(mes).slice(0, 3)}/${ano.slice(-2)}`;
    });
    const valores = chaves.map(chave => Number(meses[chave].toFixed(2)));

    const corTexto = getComputedStyle(document.body).getPropertyValue('--text').trim();
    const corTextoSoft = getComputedStyle(document.body).getPropertyValue('--text-soft').trim();
    const corBorda = getComputedStyle(document.body).getPropertyValue('--border').trim();
    const corDourada = getComputedStyle(document.body).getPropertyValue('--accent').trim();

    graficoInstancia.setOption({
      backgroundColor: 'transparent',
      tooltip: {
        trigger: 'axis',
        backgroundColor: 'rgba(20,28,45,.95)',
        borderColor: corBorda,
        textStyle: { color: corTexto },
        borderRadius: 10,
        padding: [12, 16],
        formatter: params => {
          const ponto = params[0];
          return `<div style="font-weight:600;margin-bottom:4px">${ponto.axisValue}</div><div style="color:${corDourada};font-weight:600;font-size:16px">R$ ${moeda(ponto.value)}</div>`;
        }
      },
      grid: { left: '3%', right: '4%', bottom: '12%', top: '10%', containLabel: true },
      xAxis: {
        type: 'category',
        data: rotulos.length ? rotulos : ['Sem dados'],
        axisLabel: { color: corTextoSoft, fontSize: 11, rotate: rotulos.length > 8 ? 30 : 0 },
        axisTick: { show: false },
        axisLine: { lineStyle: { color: corBorda } }
      },
      yAxis: {
        type: 'value',
        scale: true,
        axisLabel: { color: corTextoSoft, fontSize: 11, formatter: valor => `R$ ${moeda(valor)}` },
        splitLine: { lineStyle: { color: corBorda, type: 'dashed' } }
      },
      series: [{
        type: 'bar',
        data: valores.length ? valores : [0],
        barWidth: '52%',
        itemStyle: {
          borderRadius: [8, 8, 0, 0],
          color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
            { offset: 0, color: '#00d4ff' },
            { offset: 1, color: 'rgba(0,212,255,.25)' }
          ])
        },
        label: {
          show: valores.length > 0 && valores.length <= 12,
          position: 'top',
          color: corTexto,
          fontSize: 11,
          formatter: params => `R$ ${moeda(params.value)}`
        }
      }]
    }, true);
  }

  function atualizarGraficoPorUsuario() {
    if (!ehAdmin) return;
    const el = document.getElementById('graficoUsuario');
    if (!el || typeof echarts === 'undefined') {
      setTimeout(atualizarGraficoPorUsuario, 250);
      return;
    }
    if (!graficoUsuarioInstancia) graficoUsuarioInstancia = echarts.init(el);

    const porUsuario = {};
    diarias.forEach(d => {
      const nome = d.nome_usuario || 'Desconhecido';
      porUsuario[nome] = (porUsuario[nome] || 0) + Number(d.valor);
    });
    const nomes = Object.keys(porUsuario);
    const valores = nomes.map(nome => Number(porUsuario[nome].toFixed(2)));

    const corTexto = getComputedStyle(document.body).getPropertyValue('--text').trim();
    const corTextoSoft = getComputedStyle(document.body).getPropertyValue('--text-soft').trim();
    const corBorda = getComputedStyle(document.body).getPropertyValue('--border').trim();

    graficoUsuarioInstancia.setOption({
      backgroundColor: 'transparent',
      tooltip: {
        trigger: 'item',
        backgroundColor: 'rgba(20,28,45,.95)',
        borderColor: corBorda,
        textStyle: { color: corTexto },
        borderRadius: 10,
        padding: [12, 16],
        formatter: params => `<div style="font-weight:600;margin-bottom:4px">${params.name}</div><div style="color:#00d4ff;font-weight:600;font-size:16px">R$ ${moeda(params.value)}</div><div style="color:${corTextoSoft};font-size:12px;margin-top:4px">${params.percent}% do total</div>`
      },
      legend: { orient: 'horizontal', bottom: 0, textStyle: { color: corTextoSoft, fontSize: 11 } },
      series: [{
        type: 'pie',
        radius: ['40%', '70%'],
        center: ['50%', '42%'],
        label: { show: true, color: corTexto, fontSize: 11, formatter: params => `${params.name}: R$ ${moeda(params.value)}` },
        labelLine: { lineStyle: { color: corBorda } },
        data: nomes.map((nome, indice) => ({ value: valores[indice], name: nome })),
        color: ['#00d4ff', '#a855f7', '#ff4d6d', '#4ade80', '#facc15', '#ff8c00', '#ff00ff', '#00ffff']
      }]
    }, true);
  }

  function atualizarTudoDiarias() {
    preencherFiltrosDiarias();
    atualizarMetricasDiarias();
    atualizarTabelaDiarias();
    atualizarGraficoPrincipal();
    atualizarGraficoPorUsuario();
  }

  function atualizarTudoDescontos() {
    preencherFiltrosDescontos();
    atualizarMetricasDescontos();
    atualizarTabelaDescontos();
  }

  // ========================
  // MODAIS E SALVAMENTO
  // ========================
  function abrirModalDiaria(dados = null) {
    document.getElementById('modalDiaria').style.display = 'flex';
    if (dados) {
      document.getElementById('tituloModalDiaria').textContent = 'Editar Diária';
      document.getElementById('editIdDiaria').value = dados.id;
      document.getElementById('valorDiaria').value = moeda(dados.valor);
      document.getElementById('dataDiaria').value = dados.data;
      document.getElementById('descricaoDiaria').value = dados.descricao || '';
    } else {
      document.getElementById('tituloModalDiaria').textContent = 'Nova Diária';
      document.getElementById('editIdDiaria').value = '';
      document.getElementById('valorDiaria').value = '';
      document.getElementById('dataDiaria').value = hoje();
      document.getElementById('descricaoDiaria').value = '';
    }
    document.getElementById('valorDiaria').focus();
  }

  function fecharModalDiaria() {
    document.getElementById('modalDiaria').style.display = 'none';
  }

  async function salvarDiaria(event) {
    event.preventDefault();
    const botao = document.getElementById('btnSalvarDiaria');
    botao.disabled = true;
    botao.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px;"></span> Salvando...';

    try {
      const valor = moedaParaNumero(document.getElementById('valorDiaria').value);
      const data = document.getElementById('dataDiaria').value;
      const descricao = document.getElementById('descricaoDiaria').value.trim() || null;

      if (valor <= 0) throw new Error('valor_positivo');
      if (data > hoje()) throw new Error('data_nao_futura');

      const id = document.getElementById('editIdDiaria').value;
      const dados = { valor, data, descricao };

      if (id) {
        const { error } = await supabase.from('diarias').update(dados).eq('id', id);
        if (error) throw error;
        toast('✅ Diária atualizada!');
      } else {
        dados.usuario_id = usuarioAtual.id;
        dados.nome_usuario = usuarioAtual.user_metadata?.nome || usuarioAtual.email?.split('@')[0];
        const { error } = await supabase.from('diarias').insert(dados);
        if (error) throw error;
        toast('✅ Diária cadastrada!');
      }
      fecharModalDiaria();
      await carregarDiarias();
    } catch (erro) {
      toast('❌ ' + mensagemAmigavel(erro), 'erro');
    } finally {
      botao.disabled = false;
      botao.textContent = 'Salvar';
    }
  }

  function abrirModalDesconto(dados = null) {
    document.getElementById('modalDesconto').style.display = 'flex';
    if (dados) {
      document.getElementById('tituloModalDesconto').textContent = 'Editar Desconto';
      document.getElementById('editIdDesconto').value = dados.id;
      document.getElementById('descricaoDesconto').value = dados.descricao || '';
      document.getElementById('valorDesconto').value = moeda(dados.valor);
      document.getElementById('dataDesconto').value = dados.data;
    } else {
      document.getElementById('tituloModalDesconto').textContent = 'Novo Desconto';
      document.getElementById('editIdDesconto').value = '';
      document.getElementById('descricaoDesconto').value = '';
      document.getElementById('valorDesconto').value = '';
      document.getElementById('dataDesconto').value = hoje();
    }
    document.getElementById('descricaoDesconto').focus();
  }

  function fecharModalDesconto() {
    document.getElementById('modalDesconto').style.display = 'none';
  }

  async function salvarDesconto(event) {
    event.preventDefault();
    const botao = document.getElementById('btnSalvarDesconto');
    botao.disabled = true;
    botao.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px;"></span> Salvando...';

    try {
      const descricao = document.getElementById('descricaoDesconto').value.trim();
      const valor = moedaParaNumero(document.getElementById('valorDesconto').value);
      const data = document.getElementById('dataDesconto').value;

      if (!descricao) throw new Error('Informe o que foi descontado');
      if (valor <= 0) throw new Error('desconto_valor_positivo');
      if (data > hoje()) throw new Error('desconto_data_nao_futura');

      const id = document.getElementById('editIdDesconto').value;
      const dados = { descricao, valor, data };

      if (id) {
        const { error } = await supabase.from('descontos').update(dados).eq('id', id);
        if (error) throw error;
        toast('✅ Desconto atualizado!');
      } else {
        dados.usuario_id = usuarioAtual.id;
        dados.nome_usuario = usuarioAtual.user_metadata?.nome || usuarioAtual.email?.split('@')[0];
        const { error } = await supabase.from('descontos').insert(dados);
        if (error) throw error;
        toast('✅ Desconto cadastrado!');
      }
      fecharModalDesconto();
      await carregarDescontos();
    } catch (erro) {
      toast('❌ ' + mensagemAmigavel(erro), 'erro');
    } finally {
      botao.disabled = false;
      botao.textContent = 'Salvar';
    }
  }

  // ========================
  // EXCLUSÃO COM DESFAZER
  // ========================
  async function excluirDiaria(id, usuarioId) {
    if (!ehAdmin && usuarioId !== usuarioAtual.id) {
      toast('Você só pode excluir suas próprias diárias.', 'aviso');
      return;
    }
    const diaria = diarias.find(d => d.id === id);
    if (!diaria) return;

    if (desfazerTimer) clearTimeout(desfazerTimer);
    ultimoDesfazer = { tipo: 'diaria', dado: diaria };
    diarias = diarias.filter(d => d.id !== id);
    atualizarTudoDiarias();
    toast(`Diária excluída. <button onclick="desfazerExclusao()" style="background:var(--aviso);color:#000;border:none;padding:2px 8px;border-radius:6px;margin-left:8px;cursor:pointer;font-weight:600;">Desfazer</button>`, 'aviso');

    desfazerTimer = setTimeout(async () => {
      try {
        await supabase.from('diarias').delete().eq('id', id);
        ultimoDesfazer = null;
      } catch {
        carregarDiarias();
      }
    }, 10000);
  }

  async function excluirDesconto(id, usuarioId) {
    if (!ehAdmin && usuarioId !== usuarioAtual.id) {
      toast('Você só pode excluir seus próprios descontos.', 'aviso');
      return;
    }
    const desconto = descontos.find(d => d.id === id);
    if (!desconto) return;

    if (desfazerTimer) clearTimeout(desfazerTimer);
    ultimoDesfazer = { tipo: 'desconto', dado: desconto };
    descontos = descontos.filter(d => d.id !== id);
    atualizarTudoDescontos();
    toast(`Desconto excluído. <button onclick="desfazerExclusao()" style="background:var(--aviso);color:#000;border:none;padding:2px 8px;border-radius:6px;margin-left:8px;cursor:pointer;font-weight:600;">Desfazer</button>`, 'aviso');

    desfazerTimer = setTimeout(async () => {
      try {
        await supabase.from('descontos').delete().eq('id', id);
        ultimoDesfazer = null;
      } catch {
        carregarDescontos();
      }
    }, 10000);
  }

  async function desfazerExclusao() {
    if (!ultimoDesfazer) return;
    clearTimeout(desfazerTimer);
    if (ultimoDesfazer.tipo === 'diaria') {
      diarias.push(ultimoDesfazer.dado);
      diarias.sort((a, b) => b.data.localeCompare(a.data));
      atualizarTudoDiarias();
    } else {
      descontos.push(ultimoDesfazer.dado);
      descontos.sort((a, b) => b.data.localeCompare(a.data));
      atualizarTudoDescontos();
    }
    ultimoDesfazer = null;
    toast('✅ Exclusão desfeita!');
  }

  // ========================
  // EXPORTAÇÃO CSV
  // ========================
  function exportarDiarias() {
    const lista = diariasFiltradas();
    if (lista.length === 0) {
      toast('Nenhum dado para exportar', 'aviso');
      return;
    }
    const csv = '\ufeff' + [
      ['Data', 'Descrição', 'Usuário', 'Valor (R$)'].join(';'),
      ...lista.sort((a, b) => a.data.localeCompare(b.data)).map(d => [
        dataBr(d.data),
        `"${(d.descricao || '').replace(/"/g, '""')}"`,
        `"${(d.nome_usuario || '').replace(/"/g, '""')}"`,
        moeda(d.valor).replace('.', '').replace(',', '.')
      ].join(';'))
    ].join('\n');
    downloadCSV(csv, `Diarias_${hoje()}.csv`);
    toast(`✅ ${lista.length} registros exportados!`);
  }

  function exportarDescontos() {
    const lista = descontosFiltrados();
    if (lista.length === 0) {
      toast('Nenhum dado para exportar', 'aviso');
      return;
    }
    const csv = '\ufeff' + [
      ['Data', 'O que foi descontado', 'Usuário', 'Valor (R$)'].join(';'),
      ...lista.sort((a, b) => a.data.localeCompare(b.data)).map(d => [
        dataBr(d.data),
        `"${(d.descricao || '').replace(/"/g, '""')}"`,
        `"${(d.nome_usuario || '').replace(/"/g, '""')}"`,
        moeda(d.valor).replace('.', '').replace(',', '.')
      ].join(';'))
    ].join('\n');
    downloadCSV(csv, `Descontos_${hoje()}.csv`);
    toast(`✅ ${lista.length} registros exportados!`);
  }

  function downloadCSV(csv, nomeArquivo) {
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = nomeArquivo;
    link.click();
    URL.revokeObjectURL(url);
  }

  // ========================
  // EXPOSIÇÃO GLOBAL DAS FUNÇÕES
  // ========================
  window.App = {
    selecionarAba,
    alternarTema,
    mostrarCadastro,
    mostrarLogin,
    fazerLogin,
    fazerCadastro,
    sairConta,
    formatarValor,
    abrirModalDiaria,
    fecharModalDiaria,
    salvarDiaria,
    abrirModalDesconto,
    fecharModalDesconto,
    salvarDesconto,
    excluirDiaria,
    excluirDesconto,
    desfazerExclusao,
    exportarDiarias,
    exportarDescontos,
    limparFiltrosDiarias,
    limparFiltrosDescontos,
    debounceAtualizarDiarias,
    debounceAtualizarDescontos,
    filtrarDiarias,
    filtrarDescontos,
    paginar
  };

  // ========================
  // INICIALIZAÇÃO
  // ========================
  async function iniciar() {
    try {
      console.log('Iniciando CashLog...');

      // Verifica se a biblioteca do Supabase foi carregada
      if (!window.supabase) {
        throw new Error('Biblioteca Supabase não carregada. Verifique sua conexão com a internet.');
      }

      // Cria o cliente
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        realtime: { params: { eventsPerSecond: 10 } },
        auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: true }
      });

      carregarTema();
      verificarConexao();

      // Verifica se já existe uma sessão ativa
      const { data: { session } } = await supabase.auth.getSession();
      if (session?.user) {
        usuarioAtual = session.user;
        ehAdmin = (usuarioAtual.email || '').toLowerCase() === ADM_EMAIL.toLowerCase();
        entrarApp(usuarioAtual);
      } else {
        document.getElementById('telaLogin').style.display = 'flex';
      }

      // Listener de mudança de autenticação
      supabase.auth.onAuthStateChange(async (event, session) => {
        if (event === 'SIGNED_IN' && session?.user && !usuarioAtual) {
          usuarioAtual = session.user;
          ehAdmin = (usuarioAtual.email || '').toLowerCase() === ADM_EMAIL.toLowerCase();
          entrarApp(usuarioAtual);
        }
      });

      // Atalhos de teclado
      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
          e.preventDefault();
          if (abaAtiva === 'diarias') abrirModalDiaria();
          else abrirModalDesconto();
        }
        if (e.key === 'Escape') {
          fecharModalDiaria();
          fecharModalDesconto();
        }
      });

      // Fechar modais ao clicar fora
      document.getElementById('modalDiaria').addEventListener('click', (e) => {
        if (e.target.id === 'modalDiaria') fecharModalDiaria();
      });
      document.getElementById('modalDesconto').addEventListener('click', (e) => {
        if (e.target.id === 'modalDesconto') fecharModalDesconto();
      });

      console.log('CashLog iniciado com sucesso!');
    } catch (erro) {
      console.error('Erro na inicialização:', erro);
      const msg = document.getElementById('mensagemLogin');
      if (msg) {
        msg.innerHTML = `<span style="color:var(--erro)">${erro.message || 'Erro ao inicializar o aplicativo.'}</span>`;
      }
      document.getElementById('telaLogin').style.display = 'flex';
    }
  }

  // Inicia imediatamente (o script está no final do body)
  iniciar();
})();
</script>
