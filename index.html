<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CashLog</title>
    <link rel="icon" href="data:,">
    <style>
        /* ---------- ESTILOS FUTURISTAS (sem dependências externas) ---------- */
        :root{
            --bg:#0a0e17; --bg-soft:#111827; --card:#1c1f2e; --card-hover:#222638;
            --text:#e2e8f0; --text-soft:#94a3b8; --accent:#00d4ff; --accent-soft:rgba(0,212,255,.12);
            --accent2:#a855f7; --accent2-soft:rgba(168,85,247,.12); --accent3:#ff4d6d; --accent3-soft:rgba(255,77,109,.12);
            --border:rgba(148,163,184,.15); --erro:#ff4d6d; --sucesso:#4ade80; --aviso:#facc15;
            --glow:0 0 20px rgba(0,212,255,.3);
        }
        *{box-sizing:border-box;}
        body{
            margin:0;padding:0;font-family:'Inter',sans-serif;
            background:linear-gradient(135deg,var(--bg),var(--bg-soft));
            min-height:100vh;color:var(--text);
        }
        .container{max-width:1100px;margin:auto;padding:20px;}
        .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:20px;backdrop-filter:blur(10px);}
        .btn{display:inline-block;padding:10px 16px;border:none;border-radius:12px;cursor:pointer;font-weight:600;transition:.2s;}
        .btn-primary{background:linear-gradient(135deg,#00d4ff,#0090ff);color:#fff;}
        .btn-primary:hover{opacity:.9;}
        .btn-secondary{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--border);}
        .btn-secondary:hover{border-color:var(--accent);}
        .btn-danger{background:linear-gradient(135deg,#ff4d6d,#c9184a);color:#fff;}
        .btn-danger:hover{opacity:.9;}
        .input, select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:#1a1d2a;color:var(--text);margin-bottom:10px;}
        table{width:100%;border-collapse:collapse;}
        th,td{padding:10px;text-align:left;border-bottom:1px solid var(--border);}
        th{color:var(--text-soft);font-size:14px;}
        .aba{display:inline-block;padding:10px 20px;cursor:pointer;border-radius:10px 10px 0 0;color:var(--text-soft);}
        .aba.ativa{background:var(--card);color:var(--accent);}
        .painel{display:none;}
        .painel.ativo{display:block;}
        .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:50;}
        .modal{background:#1c1f2e;padding:24px;border-radius:16px;width:100%;max-width:400px;}
        .toast{position:fixed;bottom:20px;right:20px;background:#1c1f2e;border:1px solid var(--border);padding:14px 20px;border-radius:12px;z-index:9999;animation:toastIn .3s ease;}
        @keyframes toastIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
        .hidden{display:none!important;}
    </style>
</head>
<body>
    <div class="container" id="telaApp">
        <!-- Cabeçalho -->
        <div class="card" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;">
            <div>
                <h2 style="margin:0;">CashLog</h2>
                <p style="color:var(--text-soft);margin:5px 0;">Onde cada centavo conta.</p>
            </div>
            <div>
                <span id="nomeUsuario" style="background:var(--accent-soft);color:var(--accent);padding:6px 12px;border-radius:20px;font-size:14px;margin-right:10px;">Convidado</span>
                <button class="btn btn-secondary" id="btnLimparDados">Limpar dados</button>
            </div>
        </div>

        <!-- Abas -->
        <div class="card" style="display:flex;gap:10px;padding:10px;">
            <div class="aba ativa" id="abaDiarias" onclick="App.selecionarAba('diarias')">💰 Diárias</div>
            <div class="aba" id="abaDescontos" onclick="App.selecionarAba('descontos')">📉 Descontos</div>
        </div>

        <!-- Painel Diárias -->
        <div class="painel ativo" id="painelDiarias">
            <div class="card">
                <button class="btn btn-primary" onclick="App.abrirModalDiaria()">+ Nova Diária</button>
            </div>
            <div class="card">
                <h3>Histórico de Diárias</h3>
                <table>
                    <thead><tr><th>Data</th><th>Descrição</th><th>Valor</th><th>Ações</th></tr></thead>
                    <tbody id="tabelaDiarias"></tbody>
                </table>
                <div id="vazioDiarias" style="text-align:center;padding:20px;color:var(--text-soft);display:none;">Nenhuma diária cadastrada.</div>
            </div>
        </div>

        <!-- Painel Descontos -->
        <div class="painel" id="painelDescontos">
            <div class="card">
                <button class="btn btn-danger" onclick="App.abrirModalDesconto()">+ Novo Desconto</button>
            </div>
            <div class="card">
                <h3>Histórico de Descontos</h3>
                <table>
                    <thead><tr><th>Data</th><th>Descrição</th><th>Valor</th><th>Ações</th></tr></thead>
                    <tbody id="tabelaDescontos"></tbody>
                </table>
                <div id="vazioDescontos" style="text-align:center;padding:20px;color:var(--text-soft);display:none;">Nenhum desconto cadastrado.</div>
            </div>
        </div>
    </div>

    <!-- Modal Diária -->
    <div id="modalDiaria" class="modal-backdrop hidden">
        <div class="modal">
            <h3 id="tituloModalDiaria">Nova Diária</h3>
            <form id="formDiaria">
                <input class="input" type="text" id="valorDiaria" placeholder="Valor (R$)" required>
                <input class="input" type="date" id="dataDiaria" required>
                <input class="input" type="text" id="descricaoDiaria" placeholder="Descrição (opcional)">
                <div style="display:flex;gap:10px;">
                    <button class="btn btn-primary" type="submit" style="flex:1;">Salvar</button>
                    <button class="btn btn-secondary" type="button" onclick="App.fecharModalDiaria()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Desconto -->
    <div id="modalDesconto" class="modal-backdrop hidden">
        <div class="modal">
            <h3 id="tituloModalDesconto">Novo Desconto</h3>
            <form id="formDesconto">
                <input class="input" type="text" id="descricaoDesconto" placeholder="O que foi descontado?" required>
                <input class="input" type="text" id="valorDesconto" placeholder="Valor (R$)" required>
                <input class="input" type="date" id="dataDesconto" required>
                <div style="display:flex;gap:10px;">
                    <button class="btn btn-danger" type="submit" style="flex:1;">Salvar</button>
                    <button class="btn btn-secondary" type="button" onclick="App.fecharModalDesconto()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        (function() {
            // ---------- ESTADO ----------
            let diarias = [];
            let descontos = [];
            let abaAtiva = 'diarias';

            // ---------- UTILITÁRIOS ----------
            const $ = (id) => document.getElementById(id);

            function toast(msg) {
                const t = document.createElement('div');
                t.className = 'toast';
                t.textContent = msg;
                document.body.appendChild(t);
                setTimeout(() => t.remove(), 3000);
            }

            function moeda(v) {
                return Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
            }

            function moedaParaNumero(v) {
                return Number(String(v || '').replace(/\D/g, '')) / 100;
            }

            function hoje() {
                return new Date().toISOString().split('T')[0];
            }

            function dataBr(d) {
                return new Date(d + 'T00:00:00').toLocaleDateString('pt-BR');
            }

            function carregarLocal() {
                const d = localStorage.getItem('cashlog_diarias');
                const e = localStorage.getItem('cashlog_descontos');
                diarias = d ? JSON.parse(d) : [];
                descontos = e ? JSON.parse(e) : [];
            }

            function salvarLocal() {
                localStorage.setItem('cashlog_diarias', JSON.stringify(diarias));
                localStorage.setItem('cashlog_descontos', JSON.stringify(descontos));
            }

            function selecionarAba(nome) {
                abaAtiva = nome;
                document.querySelectorAll('.aba').forEach(a => a.classList.remove('ativa'));
                document.querySelectorAll('.painel').forEach(p => p.classList.remove('ativo'));
                $('aba' + nome.charAt(0).toUpperCase() + nome.slice(1)).classList.add('ativa');
                $('painel' + nome.charAt(0).toUpperCase() + nome.slice(1)).classList.add('ativo');
            }

            function atualizarTabelas() {
                // Diárias
                const tbodyD = $('tabelaDiarias');
                const vazioD = $('vazioDiarias');
                tbodyD.innerHTML = '';
                if (diarias.length === 0) {
                    vazioD.style.display = 'block';
                } else {
                    vazioD.style.display = 'none';
                    diarias.forEach(d => {
                        tbodyD.innerHTML += `<tr><td>${dataBr(d.data)}</td><td>${d.descricao || '—'}</td><td>R$ ${moeda(d.valor)}</td><td><button class="btn btn-secondary" onclick="App.excluirDiaria('${d.id}')">Excluir</button></td></tr>`;
                    });
                }

                // Descontos
                const tbodyE = $('tabelaDescontos');
                const vazioE = $('vazioDescontos');
                tbodyE.innerHTML = '';
                if (descontos.length === 0) {
                    vazioE.style.display = 'block';
                } else {
                    vazioE.style.display = 'none';
                    descontos.forEach(d => {
                        tbodyE.innerHTML += `<tr><td>${dataBr(d.data)}</td><td>${d.descricao || '—'}</td><td>R$ ${moeda(d.valor)}</td><td><button class="btn btn-secondary" onclick="App.excluirDesconto('${d.id}')">Excluir</button></td></tr>`;
                    });
                }
            }

            // ---------- MODAIS ----------
            function abrirModalDiaria() {
                $('modalDiaria').classList.remove('hidden');
                $('valorDiaria').value = '';
                $('dataDiaria').value = hoje();
                $('descricaoDiaria').value = '';
                $('tituloModalDiaria').textContent = 'Nova Diária';
            }
            function fecharModalDiaria() { $('modalDiaria').classList.add('hidden'); }

            function abrirModalDesconto() {
                $('modalDesconto').classList.remove('hidden');
                $('descricaoDesconto').value = '';
                $('valorDesconto').value = '';
                $('dataDesconto').value = hoje();
                $('tituloModalDesconto').textContent = 'Novo Desconto';
            }
            function fecharModalDesconto() { $('modalDesconto').classList.add('hidden'); }

            // ---------- SALVAR ----------
            function salvarDiaria(e) {
                e.preventDefault();
                const valor = moedaParaNumero($('valorDiaria').value);
                const data = $('dataDiaria').value;
                const descricao = $('descricaoDiaria').value.trim() || null;

                if (valor <= 0) { toast('Valor deve ser maior que zero'); return; }
                if (data > hoje()) { toast('Data não pode ser futura'); return; }

                diarias.push({ id: Date.now().toString(), valor, data, descricao });
                salvarLocal();
                toast('Diária cadastrada!');
                fecharModalDiaria();
                atualizarTabelas();
            }

            function salvarDesconto(e) {
                e.preventDefault();
                const descricao = $('descricaoDesconto').value.trim();
                const valor = moedaParaNumero($('valorDesconto').value);
                const data = $('dataDesconto').value;

                if (!descricao) { toast('Informe a descrição'); return; }
                if (valor <= 0) { toast('Valor deve ser maior que zero'); return; }
                if (data > hoje()) { toast('Data não pode ser futura'); return; }

                descontos.push({ id: Date.now().toString(), descricao, valor, data });
                salvarLocal();
                toast('Desconto cadastrado!');
                fecharModalDesconto();
                atualizarTabelas();
            }

            // ---------- EXCLUIR ----------
            function excluirDiaria(id) {
                if (!confirm('Excluir diária?')) return;
                diarias = diarias.filter(d => d.id !== id);
                salvarLocal();
                atualizarTabelas();
                toast('Diária excluída.');
            }

            function excluirDesconto(id) {
                if (!confirm('Excluir desconto?')) return;
                descontos = descontos.filter(d => d.id !== id);
                salvarLocal();
                atualizarTabelas();
                toast('Desconto excluído.');
            }

            // ---------- LIMPAR DADOS ----------
            function limparDados() {
                if (!confirm('Apagar todos os dados?')) return;
                diarias = [];
                descontos = [];
                salvarLocal();
                atualizarTabelas();
                toast('Dados removidos.');
            }

            // ---------- INICIALIZAÇÃO ----------
            function inicializar() {
                carregarLocal();
                atualizarTabelas();
            }

            // Eventos
            $('formDiaria').addEventListener('submit', salvarDiaria);
            $('formDesconto').addEventListener('submit', salvarDesconto);
            $('btnLimparDados').addEventListener('click', limparDados);

            // Expor API
            window.App = {
                selecionarAba,
                abrirModalDiaria,
                fecharModalDiaria,
                salvarDiaria,
                excluirDiaria,
                abrirModalDesconto,
                fecharModalDesconto,
                salvarDesconto,
                excluirDesconto
            };

            inicializar();
        })();
    </script>
</body>
</html>
